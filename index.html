<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>takemototosou 出勤日管理</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #f3f4f6;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      .page {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
      }
      .app {
        width: 100%;
        max-width: 440px;
        background: white;
        border-radius: 24px;
        box-shadow: 0 4px 24px #0001;
        padding: 16px;
        box-sizing: border-box;
      }
      .header,
      .total,
      .site-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .header {
        margin-bottom: 12px;
      }
      .nav {
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 6px 14px;
        background: white;
        cursor: pointer;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      .box {
        background: #f9fafb;
        border: 1px solid #eee;
        border-radius: 16px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .muted {
        color: #888;
        font-size: 13px;
      }
      .period {
        margin: 0 0 6px;
      }
      .closing-row,
      .price-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .closing-input {
        width: 60px;
      }
      input,
      select {
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 8px 10px;
        box-sizing: border-box;
        background: white;
      }
      .calendar {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 3px;
        margin-bottom: 16px;
      }
      .week-head {
        color: #888;
        font-size: 11px;
        font-weight: 700;
        text-align: center;
        padding-bottom: 4px;
      }
      .week-head.sun {
        color: #dc2626;
      }
      .week-head.sat {
        color: #2563eb;
      }
      .day {
        min-height: 72px;
        border: 1px solid #eee;
        border-radius: 10px;
        background: white;
        padding: 4px 2px;
        cursor: pointer;
        text-align: center;
      }
      .day.out {
        background: #f9fafb;
        opacity: 0.45;
      }
      .day.selected {
        border: 2px solid #3b82f6;
        background: #dbeafe;
      }
      .day.closing:not(.selected) {
        border: 1.5px dashed #93c5fd;
      }
      .day-num {
        font-size: 13px;
        font-weight: 700;
      }
      .week {
        color: #aaa;
        font-size: 10px;
      }
      .week.sun {
        color: #dc2626;
      }
      .week.sat {
        color: #2563eb;
      }
      .mark {
        margin-top: 2px;
        font-size: 14px;
      }
      .site-small {
        overflow: hidden;
        padding: 0 2px;
        color: #aaa;
        font-size: 9px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .title {
        margin: 0 0 8px;
        font-size: 15px;
        font-weight: 700;
      }
      .warning {
        margin: 0 0 8px;
        border-radius: 8px;
        background: #fef3c7;
        color: #92400e;
        padding: 4px 8px;
        font-size: 12px;
      }
      .full {
        width: 100%;
        margin-bottom: 8px;
      }
      .label {
        display: block;
        margin-bottom: 4px;
        color: #888;
        font-size: 13px;
      }
      .price-row input {
        flex: 1;
      }
      .invoice,
      .line {
        width: 100%;
        border: 0;
        color: white;
        cursor: pointer;
        font-weight: 700;
      }
      .invoice {
        border-radius: 10px;
        padding: 10px;
        font-size: 14px;
      }
      .summary {
        background: #eff6ff;
        border-radius: 16px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .summary h2 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      .site-card {
        background: white;
        border: 1px solid #eee;
        border-radius: 12px;
        padding: 10px 12px;
        margin-top: 8px;
      }
      .site-head {
        font-size: 14px;
        font-weight: 700;
      }
      .site-card p {
        margin: 4px 0 0;
        color: #888;
        font-size: 12px;
      }
      .site-total {
        margin-top: 4px;
        font-size: 14px;
        font-weight: 700;
      }
      .total {
        border-top: 1px solid #bfdbfe;
        margin-top: 10px;
        padding-top: 10px;
        font-size: 16px;
        font-weight: 700;
      }
      .line {
        background: #06c755;
        border-radius: 16px;
        padding: 14px;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="app">
        <div class="header">
          <button class="nav" id="prev">←</button>
          <h1 id="monthTitle"></h1>
          <button class="nav" id="next">→</button>
        </div>

        <section class="box">
          <p class="muted period" id="periodText"></p>
          <div class="closing-row">
            <span class="muted">当月締め日</span>
            <input class="closing-input" id="closingDay" type="number" min="1" max="31" />
            <span class="muted">日</span>
          </div>
        </section>

        <div class="calendar" id="calendar"></div>

        <section class="box">
          <p class="title" id="selectedTitle"></p>
          <p class="warning" id="warning" hidden>この日は締め期間外のため集計に含まれません</p>
          <input class="full" id="site" placeholder="現場名" />
          <select class="full" id="mark">
            <option value="○">○ 1日</option>
            <option value="△">△ 半日</option>
            <option value="×">× 休み</option>
          </select>
          <label class="label" for="price">日当</label>
          <div class="price-row">
            <input id="price" type="number" step="100" />
            <span class="muted">円</span>
          </div>
          <button class="invoice" id="invoice"></button>
        </section>

        <section class="summary">
          <h2>現場別集計</h2>
          <p class="muted period" id="summaryPeriod"></p>
          <div id="grouped"></div>
          <div class="total">
            <span>総合計</span>
            <span id="grandTotal"></span>
          </div>
        </section>

        <button class="line" id="share">LINEで共有</button>
      </div>
    </main>

    <script>
      const weekDays = ["日", "月", "火", "水", "木", "金", "土"];
      const today = new Date();
      let year = today.getFullYear();
      let month = today.getMonth() + 1;
      let selectedDay = today.getDate();
      const allClosingDays = {};
      const allWorkData = {};

      const monthKey = () => `${year}-${String(month).padStart(2, "0")}`;
      const prevMonthKey = () => {
        const date = new Date(year, month - 2, 1);
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
      };
      const workData = () => allWorkData[monthKey()] || {};
      const prevWorkData = () => allWorkData[prevMonthKey()] || {};
      const closingDay = () => allClosingDays[monthKey()] ?? 25;
      const prevClosingDay = () => allClosingDays[prevMonthKey()] ?? 25;
      const daysInMonth = () => new Date(year, month, 0).getDate();
      const normalizedClosingDay = () => Math.min(closingDay(), daysInMonth());
      const isInCurrentPeriod = (day) => day <= normalizedClosingDay();
      const markColor = (mark) => (mark === "○" ? "#15803d" : mark === "△" ? "#d97706" : mark === "×" ? "#b91c1c" : "#888");

      const defaultData = { site: "", mark: "○", price: 22000, invoice: true };
      const selectedData = () => workData()[selectedDay] || defaultData;

      function updateSelected(key, value) {
        allWorkData[monthKey()] = {
          ...workData(),
          [selectedDay]: { ...selectedData(), [key]: value },
        };
        render();
      }

      function groupedData() {
        const map = {};
        const addEntry = (label, data) => {
          if (!data.site || data.mark === "×") return;
          const key = `${data.site}-${data.invoice}`;
          if (!map[key]) map[key] = { site: data.site, invoice: data.invoice, days: [], total: 0 };
          map[key].days.push(label);
          map[key].total += data.mark === "△" ? data.price / 2 : data.price;
        };
        Object.entries(prevWorkData()).forEach(([day, data]) => {
          if (Number(day) > prevClosingDay()) addEntry(`前月${day}`, data);
        });
        Object.entries(workData()).forEach(([day, data]) => {
          if (Number(day) <= normalizedClosingDay()) addEntry(`${day}`, data);
        });
        return Object.values(map).map((group) => {
          const tax = group.invoice ? Math.floor(group.total * 0.1) : 0;
          return { ...group, tax, grand: group.total + tax };
        });
      }

      function renderCalendar() {
        const calendar = document.querySelector("#calendar");
        calendar.innerHTML = "";
        weekDays.forEach((week) => {
          const head = document.createElement("div");
          head.className = `week-head ${week === "日" ? "sun" : week === "土" ? "sat" : ""}`;
          head.textContent = week;
          calendar.appendChild(head);
        });

        const firstWeekday = new Date(year, month - 1, 1).getDay();
        for (let index = 0; index < firstWeekday; index += 1) {
          const blank = document.createElement("div");
          blank.setAttribute("aria-hidden", "true");
          calendar.appendChild(blank);
        }

        for (let day = 1; day <= daysInMonth(); day += 1) {
          const data = workData()[day];
          const date = new Date(year, month - 1, day);
          const week = weekDays[date.getDay()];
          const button = document.createElement("button");
          button.className = `day${!isInCurrentPeriod(day) ? " out" : ""}${selectedDay === day ? " selected" : ""}${day === normalizedClosingDay() ? " closing" : ""}`;
          button.type = "button";
          button.innerHTML = `
            <div class="day-num">${day}</div>
            <div class="week ${week === "日" ? "sun" : week === "土" ? "sat" : ""}">${week}</div>
            <div class="mark" style="color:${markColor(data?.mark)}">${data?.mark || "-"}</div>
            <div class="site-small">${data?.site || ""}</div>
          `;
          button.addEventListener("click", () => {
            selectedDay = day;
            render();
          });
          calendar.appendChild(button);
        }
      }

      function renderForm() {
        const data = selectedData();
        document.querySelector("#selectedTitle").textContent = `${year}年${month}月${selectedDay}日${!isInCurrentPeriod(selectedDay) ? " （集計期間外）" : ""}`;
        document.querySelector("#warning").hidden = isInCurrentPeriod(selectedDay);
        document.querySelector("#site").value = data.site;
        document.querySelector("#mark").value = data.mark;
        document.querySelector("#price").value = data.price;
        const invoice = document.querySelector("#invoice");
        invoice.textContent = data.invoice ? "✓ インボイス有" : "インボイス無";
        invoice.style.background = data.invoice ? "#15803d" : "#6b7280";
      }

      function renderSummary() {
        const grouped = groupedData();
        const grandTotal = grouped.reduce((sum, group) => sum + group.grand, 0);
        const container = document.querySelector("#grouped");
        container.innerHTML = grouped.length ? "" : '<p class="muted">データがありません</p>';
        grouped.forEach((group) => {
          const card = document.createElement("div");
          card.className = "site-card";
          card.innerHTML = `
            <div class="site-head">
              <span>${group.site}</span>
              <span style="font-size:12px;color:${group.invoice ? "#15803d" : "#aaa"}">${group.invoice ? "インボイス有" : "インボイス無"}</span>
            </div>
            <p>日: ${group.days.join(", ")}日</p>
            <p>税抜: ${group.total.toLocaleString()}円</p>
            ${group.invoice ? `<p>消費税: ${group.tax.toLocaleString()}円</p>` : ""}
            <div class="site-total">合計: ${group.grand.toLocaleString()}円</div>
          `;
          container.appendChild(card);
        });
        document.querySelector("#grandTotal").textContent = `${grandTotal.toLocaleString()}円`;
      }

      function render() {
        document.querySelector("#monthTitle").textContent = `${year}年 ${month}月`;
        document.querySelector("#periodText").textContent = `集計期間：前月${prevClosingDay() + 1}日 〜 当月${normalizedClosingDay()}日`;
        document.querySelector("#summaryPeriod").textContent = `前月${prevClosingDay() + 1}日 〜 ${month}月${normalizedClosingDay()}日`;
        document.querySelector("#closingDay").value = closingDay();
        renderCalendar();
        renderForm();
        renderSummary();
      }

      document.querySelector("#prev").addEventListener("click", () => {
        if (month === 1) {
          year -= 1;
          month = 12;
        } else {
          month -= 1;
        }
        selectedDay = 1;
        render();
      });
      document.querySelector("#next").addEventListener("click", () => {
        if (month === 12) {
          year += 1;
          month = 1;
        } else {
          month += 1;
        }
        selectedDay = 1;
        render();
      });
      document.querySelector("#closingDay").addEventListener("input", (event) => {
        allClosingDays[monthKey()] = Math.min(31, Math.max(1, Number(event.target.value) || 1));
        render();
      });
      document.querySelector("#site").addEventListener("input", (event) => updateSelected("site", event.target.value));
      document.querySelector("#mark").addEventListener("change", (event) => updateSelected("mark", event.target.value));
      document.querySelector("#price").addEventListener("input", (event) => updateSelected("price", Number(event.target.value)));
      document.querySelector("#invoice").addEventListener("click", () => updateSelected("invoice", !selectedData().invoice));
      document.querySelector("#share").addEventListener("click", () => {
        const grouped = groupedData();
        const grandTotal = grouped.reduce((sum, group) => sum + group.grand, 0);
        const text = [
          `${year}年${month}月`,
          `締め期間：前月${prevClosingDay() + 1}日〜${month}月${normalizedClosingDay()}日`,
          "",
          ...grouped.map((group) =>
            [`【${group.site}】`, group.invoice ? "インボイス有" : "インボイス無", `日数: ${group.days.join(", ")}日`, `合計: ${group.grand.toLocaleString()}円`].join("\n"),
          ),
          "",
          `総合計 ${grandTotal.toLocaleString()}円`,
        ].join("\n\n");
        window.open(`https://social-plugins.line.me/lineit/share?text=${encodeURIComponent(text)}`, "_blank", "noopener,noreferrer");
      });

      render();
    </script>
  </body>
</html>
