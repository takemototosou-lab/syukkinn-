<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>takemototosou 出勤日管理</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: #f3f4f6;
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        background: #f3f4f6;
        color: #111827;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
        touch-action: manipulation;
      }

      .page {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }

      .app {
        width: 100%;
        max-width: 440px;
        background: #ffffff;
        border-radius: 24px;
        padding: 16px;
        box-shadow: 0 10px 32px rgba(15, 23, 42, 0.12);
      }

      .header,
      .row,
      .summary-total,
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .nav-button {
        min-width: 52px;
        border: 1px solid #d1d5db;
        border-radius: 14px;
        background: #ffffff;
        padding: 12px 14px;
        font-size: 20px;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        text-align: center;
      }

      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 16px 0;
        border-radius: 18px;
        background: #f3f4f6;
        padding: 5px;
      }

      .tab-button {
        border: 0;
        border-radius: 14px;
        background: transparent;
        color: #6b7280;
        padding: 14px 0;
        font-size: 18px;
        font-weight: 800;
      }

      .tab-button.active {
        background: #ffffff;
        color: #111827;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.12);
      }

      .field {
        margin-bottom: 14px;
      }

      label,
      .label {
        display: block;
        margin-bottom: 6px;
        color: #6b7280;
        font-size: 14px;
        font-weight: 700;
      }

      input {
        width: 100%;
        border: 1px solid #d1d5db;
        border-radius: 14px;
        background: #ffffff;
        padding: 14px;
        font-size: 18px;
      }

      .calendar-head,
      .calendar {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 7px;
      }

      .calendar-head {
        margin: 10px 0 7px;
        color: #6b7280;
        font-size: 13px;
        font-weight: 800;
        text-align: center;
      }

      .week-sun {
        color: #dc2626;
      }

      .week-sat {
        color: #2563eb;
      }

      .calendar {
        margin-bottom: 16px;
      }

      .blank-day {
        min-height: 74px;
      }

      .day-button {
        min-height: 74px;
        border: 1px solid #e5e7eb;
        border-radius: 15px;
        background: #ffffff;
        padding: 5px 3px;
        text-align: center;
        overflow: hidden;
      }

      .day-button.closing-day {
        background: #fef3c7;
        border: 2px solid #f59e0b;
      }

      .day-button.today {
        background: #dbeafe;
        border-color: #93c5fd;
      }

      .day-button.selected {
        background: #2563eb;
        color: #ffffff;
        border: 2px solid #1d4ed8;
      }

      .day-button.saved {
        border-color: #22c55e;
        box-shadow: 0 0 0 2px #86efac inset;
      }

      .day-button.closing-day.saved {
        border: 2px solid #f59e0b;
      }

      .day-button.today.saved {
        border-color: #60a5fa;
      }

      .day-button.selected.saved {
        background: #2563eb;
        border: 2px solid #1d4ed8;
      }

      .day-number {
        font-size: 16px;
        font-weight: 900;
      }

      .day-week {
        color: #6b7280;
        font-size: 11px;
      }

      .day-button.selected .day-week,
      .day-button.selected .day-site {
        color: #e0f2fe;
      }

      .day-mark {
        font-size: 21px;
        font-weight: 900;
        line-height: 1.1;
      }

      .day-site {
        overflow: hidden;
        color: #6b7280;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .panel {
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        background: #f9fafb;
        padding: 14px;
      }

      .panel-title {
        margin: 0 0 12px;
        font-size: 20px;
        font-weight: 900;
      }

      .history-list {
        display: grid;
        gap: 8px;
      }

      .history-empty,
      .notice {
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        background: #ffffff;
        padding: 12px;
        color: #6b7280;
        font-size: 14px;
      }

      .history-item {
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        background: #ffffff;
        padding: 8px;
      }

      .site-select {
        flex: 1;
        min-width: 0;
        border: 0;
        background: transparent;
        padding: 10px 8px;
        overflow: hidden;
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 17px;
        font-weight: 800;
      }

      .small-button {
        border: 1px solid #d1d5db;
        border-radius: 10px;
        background: #ffffff;
        padding: 10px 11px;
        font-size: 14px;
        font-weight: 800;
      }

      .danger {
        color: #dc2626;
      }

      .mark-grid,
      .invoice-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .invoice-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .choice-button {
        border: 1px solid #d1d5db;
        border-radius: 15px;
        background: #ffffff;
        padding: 15px 0;
        color: #374151;
        font-size: 20px;
        font-weight: 900;
      }

      .choice-button.active.work {
        border-color: #16a34a;
        background: #16a34a;
        color: #ffffff;
      }

      .choice-button.active.half {
        border-color: #d97706;
        background: #f59e0b;
        color: #ffffff;
      }

      .choice-button.active.off {
        border-color: #dc2626;
        background: #dc2626;
        color: #ffffff;
      }

      .choice-button.active.invoice-on {
        border-color: #16a34a;
        background: #16a34a;
        color: #ffffff;
      }

      .choice-button.active.invoice-off {
        border-color: #374151;
        background: #374151;
        color: #ffffff;
      }

      .save-preview {
        border: 1px solid #d1d5db;
        border-radius: 14px;
        background: #ffffff;
        padding: 12px;
        margin-bottom: 12px;
        font-size: 16px;
      }

      .save-button {
        width: 100%;
        border: 0;
        border-radius: 18px;
        color: #ffffff;
        padding: 16px;
        font-size: 19px;
        font-weight: 900;
      }

      .save-button {
        background: #2563eb;
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.28);
      }

      .save-button.saved {
        background: #16a34a;
        box-shadow: 0 8px 18px rgba(22, 163, 74, 0.28);
      }

      .save-button.saving {
        background: #f59e0b;
        box-shadow: 0 8px 18px rgba(245, 158, 11, 0.28);
        transform: scale(0.98);
      }

      .card-line-button {
        width: 100%;
        border: 0;
        border-radius: 14px;
        background: #06c755;
        color: #ffffff;
        padding: 13px;
        margin-top: 12px;
        font-size: 16px;
        font-weight: 900;
      }

      .card-pdf-button {
        width: 100%;
        border: 0;
        border-radius: 14px;
        background: #111827;
        color: #ffffff;
        padding: 13px;
        margin-top: 8px;
        font-size: 16px;
        font-weight: 900;
      }

      .company-box {
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        background: #f9fafb;
        padding: 12px;
        margin-bottom: 12px;
      }

      .company-box h2 {
        margin: 0 0 10px;
        font-size: 18px;
      }

      .company-grid {
        display: grid;
        gap: 10px;
      }

      .company-grid textarea {
        width: 100%;
        min-height: 72px;
        border: 1px solid #d1d5db;
        border-radius: 14px;
        background: #ffffff;
        padding: 12px;
        font: inherit;
        font-size: 16px;
        resize: vertical;
      }

      .company-message {
        min-height: 20px;
        color: #15803d;
        font-size: 13px;
        font-weight: 800;
        text-align: center;
      }

      .invoice-render {
        position: fixed;
        left: -10000px;
        top: 0;
        width: 794px;
        min-height: 1123px;
        background: #ffffff;
        color: #111827;
        padding: 56px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      .invoice-render h1 {
        font-size: 30px;
        border-bottom: 3px solid #111827;
        padding-bottom: 12px;
        margin-bottom: 24px;
      }

      .invoice-render h2 {
        margin: 22px 0 6px;
        font-size: 18px;
      }

      .invoice-render table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 18px;
      }

      .invoice-render th,
      .invoice-render td {
        border: 1px solid #d1d5db;
        padding: 10px;
        text-align: left;
        font-size: 15px;
      }

      .invoice-render .amount {
        font-size: 24px;
        font-weight: 900;
        text-align: right;
      }

      .saved-banner {
        border: 2px solid #22c55e;
        border-radius: 18px;
        background: #ecfdf5;
        color: #166534;
        padding: 12px;
        margin-bottom: 12px;
        font-size: 16px;
      }

      .saved-banner strong {
        display: block;
        font-size: 19px;
      }

      .saved-message {
        min-height: 22px;
        color: #15803d;
        text-align: center;
        font-size: 15px;
        font-weight: 900;
      }

      .summary-box {
        border-radius: 20px;
        background: #eff6ff;
        padding: 12px;
      }

      .summary-top {
        margin-bottom: 12px;
      }

      .summary-top h2 {
        margin: 0;
        font-size: 22px;
      }

      .summary-card {
        display: block;
        border: 1px solid #e5e7eb;
        border-radius: 18px;
        background: #ffffff;
        padding: 12px;
        margin-bottom: 9px;
      }

      .summary-main {
        min-width: 0;
        flex: 1;
      }

      .summary-site {
        overflow: hidden;
        font-size: 18px;
        font-weight: 900;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .invoice-label {
        flex: 0 0 auto;
        font-size: 12px;
        font-weight: 900;
      }

      .invoice-label.on {
        color: #16a34a;
      }

      .invoice-label.off {
        color: #6b7280;
      }

      .summary-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
        margin-top: 10px;
      }

      .stat {
        border-radius: 12px;
        background: #f9fafb;
        padding: 8px;
        font-size: 13px;
      }

      .stat b {
        display: block;
        margin-top: 2px;
        font-size: 16px;
      }

      .invoice-detail {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
        margin-top: 8px;
        font-size: 13px;
      }

      .summary-total {
        border-top: 1px solid #bfdbfe;
        margin-top: 12px;
        padding-top: 12px;
        font-size: 19px;
        font-weight: 900;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>

  <body>
    <main class="page">
      <div class="app">
        <div class="header">
          <button class="nav-button" id="prevMonth" type="button">←</button>
          <h1 id="monthTitle"></h1>
          <button class="nav-button" id="nextMonth" type="button">→</button>
        </div>

        <div class="tabs">
          <button class="tab-button active" id="inputTab" type="button">入力</button>
          <button class="tab-button" id="summaryTab" type="button">集計</button>
        </div>

        <section class="field">
          <label for="closingDay">締め日</label>
          <input id="closingDay" type="number" min="1" max="31" inputmode="numeric" />
        </section>

        <section id="inputPage">
          <div id="savedBanner"></div>
          <div class="calendar-head" id="calendarHead"></div>
          <div class="calendar" id="calendar"></div>

          <div class="panel">
            <p class="panel-title" id="selectedDateTitle"></p>

            <div class="field">
              <label for="siteInput">現場名</label>
              <input id="siteInput" type="text" placeholder="現場名" />
            </div>

            <div class="field">
              <div class="label">記憶した現場名</div>
              <div class="history-list" id="siteHistory"></div>
            </div>

            <div class="field">
              <div class="label">勤務</div>
              <div class="mark-grid">
                <button class="choice-button" id="markWork" type="button">○</button>
                <button class="choice-button" id="markHalf" type="button">△</button>
                <button class="choice-button" id="markOff" type="button">×</button>
              </div>
            </div>

            <div class="field">
              <label for="priceInput">日当</label>
              <input id="priceInput" type="number" inputmode="numeric" step="100" placeholder="日当" />
            </div>

            <div class="field">
              <div class="label">インボイス</div>
              <div class="invoice-grid">
                <button class="choice-button" id="invoiceOn" type="button">有り</button>
                <button class="choice-button" id="invoiceOff" type="button">無し</button>
              </div>
            </div>

            <div class="save-preview" id="savePreview"></div>
            <button class="save-button" id="saveButton" type="button">決定</button>
            <div class="saved-message" id="savedMessage"></div>
          </div>
        </section>

        <section class="hidden" id="summaryPage">
          <div class="company-box">
            <h2>自社情報設定</h2>
            <div class="company-grid">
              <div>
                <label for="companyName">自社名</label>
                <input id="companyName" type="text" placeholder="自社名" />
              </div>
              <div>
                <label for="companyAddress">住所</label>
                <textarea id="companyAddress" placeholder="住所"></textarea>
              </div>
              <div>
                <label for="companyPhone">電話番号</label>
                <input id="companyPhone" type="text" placeholder="電話番号" />
              </div>
              <div>
                <label for="companyInvoice">インボイス登録番号</label>
                <input id="companyInvoice" type="text" placeholder="Tから始まる番号など" />
              </div>
              <div>
                <label for="companyBank">振込先</label>
                <textarea id="companyBank" placeholder="銀行名・支店名・口座番号など"></textarea>
              </div>
              <button class="save-button" id="saveCompanyInfo" type="button">自社情報を保存</button>
              <div class="company-message" id="companyMessage"></div>
            </div>
          </div>

          <div class="summary-box">
            <div class="summary-top row">
              <h2>現場別集計</h2>
            </div>
            <div id="summaryList"></div>
          </div>
        </section>
      </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
      const weekDays = ["日", "月", "火", "水", "木", "金", "土"];
      const siteStorageKey = "work-calendar-sites";
      const closingStorageKey = "work-calendar-closing-days";
      const companyStorageKey = "work-calendar-company-info";

      const today = new Date();
      let year = today.getFullYear();
      let month = today.getMonth() + 1;
      let selectedDay = today.getDate();
      let currentView = "input";
      let workData = {};
      let savedSites = [];
      let closingDays = {};
      let companyInfo = {};
      let draftData = null;
      let editingSite = "";
      let editingSiteName = "";
      let justSavedDay = null;

      const defaultWork = {
        site: "",
        mark: "○",
        price: 18000,
        invoice: true,
      };
      const normalFullPrice = 18000;
      const normalHalfPrice = 9000;

      function readStorage(key, fallback) {
        try {
          const saved = localStorage.getItem(key);
          return saved ? JSON.parse(saved) : fallback;
        } catch {
          return fallback;
        }
      }

      function writeStorage(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      }

      function getMonthKey() {
        return `${year}-${String(month).padStart(2, "0")}`;
      }

      function getWorkStorageKey() {
        return `work-calendar-${getMonthKey()}`;
      }

      function getClosingDay() {
        return closingDays[getMonthKey()] ?? 25;
      }

      function setClosingDay(value) {
        const safe = Math.min(31, Math.max(1, Number(value) || 1));
        closingDays = { ...closingDays, [getMonthKey()]: safe };
        writeStorage(closingStorageKey, closingDays);
      }

      function loadMonth() {
        workData = readStorage(getWorkStorageKey(), {});
      }

      function saveMonth() {
        writeStorage(getWorkStorageKey(), workData);
      }

      function loadGlobalData() {
        savedSites = readStorage(siteStorageKey, []);
        closingDays = readStorage(closingStorageKey, {});
        companyInfo = readStorage(companyStorageKey, {});
      }

      function saveSites() {
        writeStorage(siteStorageKey, savedSites);
      }

      function saveCompanyInfo() {
        companyInfo = {
          name: document.querySelector("#companyName").value.trim(),
          address: document.querySelector("#companyAddress").value.trim(),
          phone: document.querySelector("#companyPhone").value.trim(),
          invoice: document.querySelector("#companyInvoice").value.trim(),
          bank: document.querySelector("#companyBank").value.trim(),
        };
        writeStorage(companyStorageKey, companyInfo);
        document.querySelector("#companyMessage").textContent = "自社情報を保存しました";
      }

      function renderCompanyInfoForm() {
        document.querySelector("#companyName").value = companyInfo.name || "";
        document.querySelector("#companyAddress").value = companyInfo.address || "";
        document.querySelector("#companyPhone").value = companyInfo.phone || "";
        document.querySelector("#companyInvoice").value = companyInfo.invoice || "";
        document.querySelector("#companyBank").value = companyInfo.bank || "";
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function getSelectedData() {
        return workData[selectedDay] || { ...defaultWork };
      }

      function resetDraft() {
        draftData = { ...getSelectedData() };
        justSavedDay = null;
      }

      function getDaysInMonth() {
        return new Date(year, month, 0).getDate();
      }

      function getCalendarDays() {
        const firstDay = new Date(year, month - 1, 1).getDay();
        const blanks = Array.from({ length: firstDay }, (_, index) => ({ blank: true, key: `blank-${index}` }));
        const days = Array.from({ length: getDaysInMonth() }, (_, index) => {
          const day = index + 1;
          const date = new Date(year, month - 1, day);
          return {
            blank: false,
            key: `day-${day}`,
            day,
            week: weekDays[date.getDay()],
          };
        });
        return [...blanks, ...days];
      }

      function setDraft(key, value, shouldRender = true) {
        draftData = { ...(draftData || getSelectedData()), [key]: value };
        justSavedDay = null;
        if (shouldRender) render();
      }

      function rememberSite(site) {
        const trimmed = site.trim();
        if (!trimmed) return;
        if (!savedSites.includes(trimmed)) {
          savedSites = [...savedSites, trimmed];
          saveSites();
        }
      }

      function reflectSavedDayOnCalendar(day, data) {
        const cell = document.querySelector(`.day-button[data-day="${day}"]`);
        if (!cell) return;

        const mark = cell.querySelector(".day-mark");
        const site = cell.querySelector(".day-site");
        if (mark) mark.textContent = data.mark || "-";
        if (site) site.textContent = data.site || "";

        cell.classList.add("selected");
        cell.classList.add("saved");
      }

      function saveSelectedDay() {
        const saveButton = document.querySelector("#saveButton");
        if (saveButton) {
          saveButton.textContent = "保存中...";
          saveButton.classList.remove("saved");
          saveButton.classList.add("saving");
        }

        const siteInput = document.querySelector("#siteInput");
        const priceInput = document.querySelector("#priceInput");
        const currentDraft = draftData || getSelectedData();
        draftData = {
          ...currentDraft,
          site: (siteInput ? siteInput.value : currentDraft.site).trim(),
          price: priceInput ? Number(priceInput.value || 0) : Number(currentDraft.price || 0),
        };

        workData[selectedDay] = { ...draftData };
        justSavedDay = selectedDay;
        rememberSite(draftData.site);
        saveMonth();
        render();
        reflectSavedDayOnCalendar(selectedDay, draftData);

        requestAnimationFrame(() => {
          reflectSavedDayOnCalendar(selectedDay, draftData);
          const savedButton = document.querySelector("#saveButton");
          if (savedButton) {
            savedButton.textContent = "決定済み";
            savedButton.classList.remove("saving");
            savedButton.classList.add("saved");
          }
        });
      }

      function getGroups() {
        const map = {};
        Object.entries(workData).forEach(([day, data]) => {
          if (!data.site || data.mark === "×") return;
          const key = `${data.site}-${data.invoice ? "invoice" : "no-invoice"}`;
          if (!map[key]) {
            map[key] = {
              key,
              site: data.site,
              invoice: data.invoice,
              fullDays: 0,
              halfDays: 0,
              normalFullDays: 0,
              normalHalfDays: 0,
              variableItems: [],
              total: 0,
            };
          }

          const price = Number(data.price || 0);
          const amount = data.mark === "△" ? price / 2 : price;
          map[key].total += amount;
          if (data.mark === "○") map[key].fullDays += 1;
          if (data.mark === "△") map[key].halfDays += 1;

          const isNormalFull = data.mark === "○" && amount === normalFullPrice;
          const isNormalHalf = data.mark === "△" && amount === normalHalfPrice;
          if (isNormalFull) {
            map[key].normalFullDays += 1;
          } else if (isNormalHalf) {
            map[key].normalHalfDays += 1;
          } else {
            map[key].variableItems.push({
              day: Number(day),
              mark: data.mark,
              amount,
            });
          }
        });

        return Object.values(map).map((group) => {
          const tax = group.invoice ? Math.floor(group.total * 0.1) : 0;
          const workDays = group.fullDays + group.halfDays * 0.5;
          return {
            ...group,
            tax,
            grand: group.total + tax,
            workDays,
          };
        });
      }

      function getPeriodLabel() {
        return `${year}年${month}月`;
      }

      function shareGroupToLine(groupKey) {
        const group = getGroups().find((item) => item.key === groupKey);
        if (!group) return;

        const text = [
          "【作業報告】",
          `現場名：${group.site}`,
          `期間：${getPeriodLabel()}`,
          `○ ${group.fullDays}日`,
          `△ ${group.halfDays}日`,
          `日数換算：${group.workDays}日`,
          `税抜：${group.total.toLocaleString()}円`,
          `消費税：${group.tax.toLocaleString()}円`,
          `請求額：${group.grand.toLocaleString()}円`,
        ].join("\n");

        window.open(`https://social-plugins.line.me/lineit/share?text=${encodeURIComponent(text)}`, "_blank", "noopener,noreferrer");
      }

      function todayLabel() {
        const now = new Date();
        return `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
      }

      function money(value) {
        return `${Number(value || 0).toLocaleString()}円`;
      }

      function nl2br(value) {
        return escapeHtml(value || "").replaceAll("\n", "<br>");
      }

      function buildNormalWorkRows(group) {
        const normalFullTotal = group.normalFullDays * normalFullPrice;
        const normalHalfTotal = group.normalHalfDays * normalHalfPrice;
        const rows = [];
        if (group.normalFullDays > 0) {
          rows.push(`
              <tr>
                <th>○ ${group.normalFullDays}日 × ${money(normalFullPrice)}</th>
                <td>${money(normalFullTotal)}</td>
              </tr>
          `);
        }
        if (group.normalHalfDays > 0) {
          rows.push(`
              <tr>
                <th>△ ${group.normalHalfDays}日 × ${money(normalHalfPrice)}</th>
                <td>${money(normalHalfTotal)}</td>
              </tr>
          `);
        }

        if (!rows.length) return "";

        return `
          <h2>通常作業</h2>
          <table>
            <tbody>${rows.join("")}</tbody>
          </table>
        `;
      }

      function buildVariableWorkRows(group) {
        if (!group.variableItems.length) return "";
        const rows = group.variableItems
          .sort((a, b) => a.day - b.day)
          .map(
            (item) => `
              <tr>
                <th>${month}/${item.day}</th>
                <td>${item.mark} 1日 × ${money(item.amount)}</td>
                <td>${money(item.amount)}</td>
              </tr>
            `,
          )
          .join("");

        return `
          <h2>変動単価</h2>
          <table>
            <tbody>${rows}</tbody>
          </table>
        `;
      }

      function buildInvoiceElement(group, customerName) {
        const invoice = document.createElement("div");
        invoice.className = "invoice-render";
        invoice.innerHTML = `
          <h1>請求書</h1>
          <div class="row">
            <div>
              <p><strong>請求先名</strong></p>
              <p style="font-size:22px;font-weight:900;">${escapeHtml(customerName || "御中")}</p>
            </div>
            <div style="text-align:right;">
              <p><strong>請求日</strong> ${todayLabel()}</p>
              <p><strong>対象期間</strong> ${getPeriodLabel()}</p>
            </div>
          </div>
          <p class="amount">請求金額（税込） ${money(group.grand)}</p>
          <table>
            <tbody>
              <tr><th>現場名</th><td>${escapeHtml(group.site)}</td></tr>
              <tr><th>○日数</th><td>${group.fullDays}日</td></tr>
              <tr><th>△日数</th><td>${group.halfDays}日</td></tr>
              <tr><th>日数換算</th><td>${group.workDays}日</td></tr>
              <tr><th>税抜金額</th><td>${money(group.total)}</td></tr>
              <tr><th>消費税</th><td>${money(group.tax)}</td></tr>
              <tr><th>請求金額（税込）</th><td>${money(group.grand)}</td></tr>
            </tbody>
          </table>
          ${buildNormalWorkRows(group)}
          ${buildVariableWorkRows(group)}
          <table>
            <tbody>
              <tr><th>自社名</th><td>${escapeHtml(companyInfo.name || "")}</td></tr>
              <tr><th>住所</th><td>${nl2br(companyInfo.address)}</td></tr>
              <tr><th>電話番号</th><td>${escapeHtml(companyInfo.phone || "")}</td></tr>
              <tr><th>インボイス登録番号</th><td>${escapeHtml(companyInfo.invoice || "")}</td></tr>
              <tr><th>振込先</th><td>${nl2br(companyInfo.bank)}</td></tr>
              <tr><th>備考</th><td>上記の通りご請求申し上げます。</td></tr>
            </tbody>
          </table>
        `;
        return invoice;
      }

      async function createInvoicePdf(groupKey) {
        const group = getGroups().find((item) => item.key === groupKey);
        if (!group) return;
        if (!window.jspdf || !window.html2canvas) {
          alert("PDF作成ライブラリの読み込み中です。少し待ってからもう一度押してください。");
          return;
        }

        const customerName = window.prompt("請求先名を入力してください。未入力なら「御中」で作成します。", "") || "御中";
        const invoice = buildInvoiceElement(group, customerName);
        document.body.appendChild(invoice);

        try {
          const canvas = await html2canvas(invoice, { scale: 2, backgroundColor: "#ffffff" });
          const imgData = canvas.toDataURL("image/png");
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF("p", "mm", "a4");
          const pageWidth = pdf.internal.pageSize.getWidth();
          const pageHeight = pdf.internal.pageSize.getHeight();
          pdf.addImage(imgData, "PNG", 0, 0, pageWidth, pageHeight);
          pdf.save(`請求書_${group.site}_${getPeriodLabel()}.pdf`);
        } finally {
          invoice.remove();
        }
      }

      function renderBase() {
        document.querySelector("#monthTitle").textContent = `${year}年 ${month}月`;
        document.querySelector("#closingDay").value = getClosingDay();
        document.querySelector("#inputTab").classList.toggle("active", currentView === "input");
        document.querySelector("#summaryTab").classList.toggle("active", currentView === "summary");
        document.querySelector("#inputPage").classList.toggle("hidden", currentView !== "input");
        document.querySelector("#summaryPage").classList.toggle("hidden", currentView !== "summary");
      }

      function renderCalendarHead() {
        document.querySelector("#calendarHead").innerHTML = weekDays
          .map((week) => `<div class="${week === "日" ? "week-sun" : week === "土" ? "week-sat" : ""}">${week}</div>`)
          .join("");
      }

      function renderCalendar() {
        const now = new Date();
        const isCurrentMonth = year === now.getFullYear() && month === now.getMonth() + 1;
        const todayDate = isCurrentMonth ? now.getDate() : null;
        const closingDay = getClosingDay();

        document.querySelector("#calendar").innerHTML = getCalendarDays()
          .map((item) => {
            if (item.blank) return `<div class="blank-day"></div>`;

            const data = workData[item.day] || {};
            const isSelected = Number(selectedDay) === Number(item.day);
            const isToday = Number(todayDate) === Number(item.day);
            const isClosingDay = Number(closingDay) === Number(item.day);
            const isSaved = justSavedDay === item.day;
            const dayClasses = [
              "day-button",
              isClosingDay ? "closing-day" : "",
              isToday ? "today" : "",
              isSelected ? "selected" : "",
              isSaved ? "saved" : "",
            ]
              .filter(Boolean)
              .join(" ");

            return `
              <button type="button" data-day="${item.day}" class="${dayClasses}">
                <div class="day-number">${item.day}</div>
                <div class="day-week ${item.week === "日" ? "week-sun" : item.week === "土" ? "week-sat" : ""}">${item.week}</div>
                <div class="day-mark">${escapeHtml(data.mark || "-")}</div>
                <div class="day-site">${escapeHtml(data.site || "")}</div>
              </button>
            `;
          })
          .join("");

        document.querySelectorAll(".day-button").forEach((button) => {
          button.addEventListener("click", () => {
            selectedDay = Number(button.dataset.day);
            resetDraft();
            render();
          });
        });
      }

      function renderSavedBanner() {
        const banner = document.querySelector("#savedBanner");
        if (!justSavedDay) {
          banner.innerHTML = "";
          return;
        }
        const data = draftData || getSelectedData();
        banner.innerHTML = `
          <div class="saved-banner">
            <strong>保存しました</strong>
            ${month}月${justSavedDay}日 / ${escapeHtml(data.site || "現場名未入力")} / ${escapeHtml(data.mark)} / インボイス${data.invoice ? "有り" : "無し"}
          </div>
        `;
      }

      function renderSiteHistory() {
        const root = document.querySelector("#siteHistory");
        if (savedSites.length === 0) {
          root.innerHTML = `<div class="history-empty">保存すると現場名がここに表示されます。</div>`;
          return;
        }

        root.innerHTML = savedSites
          .map((site) => {
            if (editingSite === site) {
              return `
                <div class="history-item">
                  <input class="edit-site-input" value="${escapeHtml(editingSiteName)}" />
                  <div class="row" style="margin-top:8px;">
                    <button type="button" class="small-button save-site-edit">保存</button>
                    <button type="button" class="small-button cancel-site-edit">戻る</button>
                  </div>
                </div>
              `;
            }

            return `
              <div class="history-item">
                <div class="row">
                  <button type="button" class="site-select" data-site="${escapeHtml(site)}">${escapeHtml(site)}</button>
                  <button type="button" class="small-button site-edit" data-site="${escapeHtml(site)}">編集</button>
                  <button type="button" class="small-button danger site-delete" data-site="${escapeHtml(site)}">削除</button>
                </div>
              </div>
            `;
          })
          .join("");

        document.querySelectorAll(".site-select").forEach((button) => {
          button.addEventListener("click", () => setDraft("site", button.dataset.site));
        });
        document.querySelectorAll(".site-edit").forEach((button) => {
          button.addEventListener("click", () => {
            editingSite = button.dataset.site;
            editingSiteName = button.dataset.site;
            render();
          });
        });
        document.querySelectorAll(".site-delete").forEach((button) => {
          button.addEventListener("click", () => {
            const site = button.dataset.site;
            savedSites = savedSites.filter((item) => item !== site);
            if (draftData && draftData.site === site) draftData.site = "";
            if (editingSite === site) {
              editingSite = "";
              editingSiteName = "";
            }
            saveSites();
            render();
          });
        });

        const editInput = document.querySelector(".edit-site-input");
        if (editInput) {
          editInput.addEventListener("input", (event) => {
            editingSiteName = event.target.value;
          });
          document.querySelector(".save-site-edit").addEventListener("click", () => {
            const nextName = editingSiteName.trim();
            if (!nextName) return;
            savedSites = savedSites.map((site) => (site === editingSite ? nextName : site));
            Object.entries(workData).forEach(([day, data]) => {
              if (data.site === editingSite) workData[day] = { ...data, site: nextName };
            });
            if (draftData && draftData.site === editingSite) draftData.site = nextName;
            editingSite = "";
            editingSiteName = "";
            saveSites();
            saveMonth();
            render();
          });
          document.querySelector(".cancel-site-edit").addEventListener("click", () => {
            editingSite = "";
            editingSiteName = "";
            render();
          });
        }
      }

      function renderInputForm() {
        const data = draftData || getSelectedData();
        document.querySelector("#selectedDateTitle").textContent = `${year}年${month}月${selectedDay}日`;
        document.querySelector("#siteInput").value = data.site;
        document.querySelector("#priceInput").value = data.price;
        document.querySelector("#savePreview").innerHTML = `
          <strong>${escapeHtml(data.site || "現場名未入力")}</strong><br>
          ${escapeHtml(data.mark)} / ${Number(data.price || 0).toLocaleString()}円 / インボイス${data.invoice ? "有り" : "無し"}
        `;
        document.querySelector("#savedMessage").textContent = justSavedDay ? "カレンダーに反映しました" : "";

        document.querySelector("#markWork").className = `choice-button ${data.mark === "○" ? "active work" : ""}`;
        document.querySelector("#markHalf").className = `choice-button ${data.mark === "△" ? "active half" : ""}`;
        document.querySelector("#markOff").className = `choice-button ${data.mark === "×" ? "active off" : ""}`;
        document.querySelector("#invoiceOn").className = `choice-button ${data.invoice ? "active invoice-on" : ""}`;
        document.querySelector("#invoiceOff").className = `choice-button ${!data.invoice ? "active invoice-off" : ""}`;
        document.querySelector("#saveButton").textContent = justSavedDay ? "決定済み" : "決定";
        document.querySelector("#saveButton").classList.remove("saving");
        document.querySelector("#saveButton").classList.toggle("saved", Boolean(justSavedDay));
      }

      function renderInputPage() {
        renderBase();
        renderSavedBanner();
        renderCalendarHead();
        renderCalendar();
        renderSiteHistory();
        renderInputForm();
      }

      function renderSummaryPage() {
        renderBase();
        renderCompanyInfoForm();

        const groups = getGroups();

        if (groups.length === 0) {
          document.querySelector("#summaryList").innerHTML = `<div class="notice">まだ集計する出勤データがありません。</div>`;
          return;
        }

        document.querySelector("#summaryList").innerHTML = groups
          .map(
            (group) => `
              <div class="summary-card">
                <div class="row">
                  <div class="summary-main">
                    <div class="card-head">
                      <div class="summary-site">${escapeHtml(group.site)}</div>
                      <div class="invoice-label ${group.invoice ? "on" : "off"}">${group.invoice ? "有り" : "無し"}</div>
                    </div>
                    <div class="summary-stats">
                      <div class="stat">○<b>${group.fullDays}日</b></div>
                      <div class="stat">△<b>${group.halfDays}日</b></div>
                      <div class="stat">換算<b>${group.workDays}日</b></div>
                    </div>
                    <div class="invoice-detail">
                      <div>税抜<br><b>${group.total.toLocaleString()}円</b></div>
                      <div>消費税<br><b>${group.tax.toLocaleString()}円</b></div>
                      <div>請求額<br><b>${group.grand.toLocaleString()}円</b></div>
                    </div>
                    <button class="card-line-button" type="button" data-group="${escapeHtml(group.key)}">この現場だけLINEで送る</button>
                    <button class="card-pdf-button" type="button" data-group="${escapeHtml(group.key)}">PDF請求書を作る</button>
                  </div>
                </div>
              </div>
            `,
          )
          .join("");

        document.querySelectorAll(".card-line-button").forEach((button) => {
          button.addEventListener("click", () => {
            shareGroupToLine(button.dataset.group);
          });
        });

        document.querySelectorAll(".card-pdf-button").forEach((button) => {
          button.addEventListener("click", () => {
            createInvoicePdf(button.dataset.group);
          });
        });
      }

      function render() {
        if (currentView === "input") renderInputPage();
        else renderSummaryPage();
      }

      document.querySelector("#prevMonth").addEventListener("click", () => {
        if (month === 1) {
          year -= 1;
          month = 12;
        } else {
          month -= 1;
        }
        selectedDay = 1;
        loadMonth();
        resetDraft();
        render();
      });

      document.querySelector("#nextMonth").addEventListener("click", () => {
        if (month === 12) {
          year += 1;
          month = 1;
        } else {
          month += 1;
        }
        selectedDay = 1;
        loadMonth();
        resetDraft();
        render();
      });

      document.querySelector("#inputTab").addEventListener("click", () => {
        currentView = "input";
        render();
      });

      document.querySelector("#summaryTab").addEventListener("click", () => {
        currentView = "summary";
        render();
      });

      document.querySelector("#closingDay").addEventListener("input", (event) => {
        setClosingDay(event.target.value);
      });

      document.querySelector("#siteInput").addEventListener("input", (event) => {
        setDraft("site", event.target.value, false);
        renderInputForm();
      });

      document.querySelector("#priceInput").addEventListener("input", (event) => {
        setDraft("price", Number(event.target.value || 0), false);
        renderInputForm();
      });

      document.querySelector("#markWork").addEventListener("click", () => setDraft("mark", "○"));
      document.querySelector("#markHalf").addEventListener("click", () => setDraft("mark", "△"));
      document.querySelector("#markOff").addEventListener("click", () => setDraft("mark", "×"));
      document.querySelector("#invoiceOn").addEventListener("click", () => setDraft("invoice", true));
      document.querySelector("#invoiceOff").addEventListener("click", () => setDraft("invoice", false));
      document.querySelector("#saveButton").addEventListener("click", saveSelectedDay);
      document.querySelector("#saveCompanyInfo").addEventListener("click", saveCompanyInfo);
      loadGlobalData();
      loadMonth();
      resetDraft();
      render();
    </script>
  </body>
</html>
